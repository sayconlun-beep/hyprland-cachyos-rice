# The shell layer, one tool per job:
#   rice-wallpaper restore   starts awww-daemon, shows the last wallpaper and
#                            derives the palette from it (matugen)
#   waybar                   bar
#   qs -c rice               Quickshell: notifications, OSD, control centre, overlays
#   hyprpolkitagent          polkit password dialogs
#   hypridle -> hyprlock     idle and lock
exec-once = ~/.local/bin/rice-wallpaper restore
exec-once = waybar
exec-once = systemctl --user start hyprpolkitagent
exec-once = hypridle
exec-once = wl-paste --type text  --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = qs -c rice -n -d                         # quickshell: OSD, control centre, clock, visualiser, overlays
