# Window rules. Hyprland 0.53+ uses named blocks with match: keys; the old
# one-line `windowrulev2 = ...` form is gone. --verify-config catches mistakes,
# EXCEPT that it accepts any value for `group`.

windowrule {
    name = suppress-maximize
    match:class = .*
    suppress_event = maximize
}

windowrule {
    name = taskmgr-float
    match:class = ^(taskmgr)$
    float = yes
    center = yes
    size = 1200 800
}

windowrule {
    name = float-utilities
    match:class = ^(pavucontrol|org\.pulseaudio\.pavucontrol|nm-connection-editor|hyprpolkitagent|com\.gabm\.satty|org\.kde\.kcalc)$
    float = yes
}

windowrule {
    name = pip-always-on-top
    match:title = ^(Picture-in-Picture)$
    float = yes
    pin = yes
}

windowrule {
    name = media-idle-inhibit
    match:class = ^(firefox|chromium|mpv)$
    idle_inhibit = focus
}

windowrule {
    name = video-players-float
    match:class = ^(vlc|mpv)$
    float = yes
}

# ------------------------------------------------------------------ games --
windowrule {
    name = steam-to-main
    match:class = ^(steam|Steam)$
    workspace = 1
}

# Steam titles, wine/proton .exe windows, Lutris, emulators, Moonlight.
windowrule {
    name = games-to-main
    match:class = ^(steam_app_.*|.*\.exe|lutris|net\.lutris\.Lutris|moonlight|ryujinx)$
    workspace = 1
    fullscreen = yes
    immediate = yes
    idle_inhibit = always
}
