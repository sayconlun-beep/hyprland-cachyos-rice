# 1 main    drafting AND gaming - Steam and games are sent here (rules.conf)
# 2 and up  no rule: each opens on whichever monitor is focused, and
#           disappears from the bar again once it is empty
#
# To keep a workspace on one monitor, add `monitor:<name>` to its line.
# `monitor:` only applies when a workspace is CREATED - existing ones stay put
# through a reload; move them with `hyprctl dispatch moveworkspacetomonitor`.
workspace = 1, defaultName:main, layoutopt:orientation:left
