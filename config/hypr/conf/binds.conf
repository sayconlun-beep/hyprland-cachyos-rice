# Your apps: point $term, $files and $browser at whatever you use.
$mod     = SUPER
$bin     = ~/.local/bin          # not on the session PATH - always spell it out
$term    = kitty
$files   = dolphin
$browser = firefox

# ------------------------------------------------------------------- apps --
bind = $mod, RETURN, exec, steam
bind = $mod, T,      exec, $term
bind = CTRL ALT, DELETE, exec, $term --class taskmgr -e btop
bind = $mod, SPACE,  exec, rofi -show drun
bind = $mod, E,      exec, $files
bind = $mod, B,      exec, $browser
bind = $mod, Q,      killactive,
bind = $mod SHIFT, Q, exit,
bind = $mod, G,      togglefloating,
bind = $mod, S,      fullscreen,
bind = $mod, A,      layoutmsg, togglesplit

# ------------------------------------------------------------------ shell --
bind = $mod, C,         exec, $bin/rice-clipboard
bind = $mod, N,         exec, qs -c rice ipc call notifications toggle   # notification centre
bind = $mod, X,         exec, $bin/rice-power
bind = $mod, ESCAPE,    exec, loginctl lock-session          # hypridle locks (Quickshell, else hyprlock)
bind = $mod SHIFT, W,   exec, qs -c rice ipc call wallpaper toggle   # carousel
bind = $mod, slash,     exec, qs -c rice ipc call binds toggle       # cheatsheet + rebinding
bind = $mod, comma,     exec, qs -c rice ipc call settings toggle    # settings hub
bind = $mod, D,         exec, qs -c rice ipc call dashboard toggle   # dashboard
bind = $mod SHIFT, S,   exec, qs -c rice ipc call capture menu       # screenshot / record
bind = $mod ALT, W,     exec, $bin/rice-wallpaper next
bind = $mod CTRL, W,    exec, $bin/rice-wallhaven
bind = $mod SHIFT, D,   exec, $bin/rice-settings displays
bind = $mod SHIFT, A,   exec, $bin/rice-settings look        # $mod A alone is togglesplit
bind = $mod SHIFT, B,   exec, pkill -USR1 -x waybar          # hide/show the bar
bind = $mod SHIFT, V,   exec, qs -c rice ipc call visualiser toggle   # desktop visualiser

bind = , Print,         exec, grim -g "$(slurp)" - | wl-copy -t image/png
bind = SHIFT, Print,    exec, grim - | wl-copy -t image/png
bind = $mod, Print,     exec, grim -g "$(slurp)" ~/Pictures/shot-$(date +%s).png
bind = CTRL, Print,     exec, grim -g "$(slurp)" - | satty -f -
bind = , F8,            exec, $HOME/.local/bin/gsr-replay-save   # save the last 3 min of the replay buffer

# ---------------------------------------------------- reading back / focus --
bind = $mod, P,            exec, $bin/read-aloud.sh --toggle
bind = $mod, bracketleft,  exec, $bin/read-aloud.sh --back
bind = $mod, bracketright, exec, $bin/read-aloud.sh --forward
bind = $mod SHIFT, R,      exec, $bin/read-aloud.sh --selection
bind = $mod SHIFT, P,      exec, $bin/read-aloud.sh --stop
bind = $mod, F,            exec, $bin/hypr-focus.sh

# ------------------------------------------------------- windows (vim keys) --
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r
bind = $mod, left,  movefocus, l
bind = $mod, down,  movefocus, d
bind = $mod, up,    movefocus, u
bind = $mod, right, movefocus, r

bind = $mod CTRL, H, swapwindow, l
bind = $mod CTRL, J, swapwindow, d
bind = $mod CTRL, K, swapwindow, u
bind = $mod CTRL, L, swapwindow, r

binde = $mod SHIFT, H, resizeactive, -80 0
binde = $mod SHIFT, J, resizeactive, 0 80
binde = $mod SHIFT, K, resizeactive, 0 -80
binde = $mod SHIFT, L, resizeactive, 80 0

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# ------------------------------------------------------------- workspaces --
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10
bind = $mod, M, workspace, previous

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

bind = $mod, TAB, cyclenext,
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up,   workspace, e-1

# ------------------------------------------------------ media keys (+ OSD) --
# Plain commands: the Quickshell OSD (Osd.qml) watches PipeWire and the
# players itself, so nothing here has to ask for it to appear.
bindel = , XF86AudioRaiseVolume,  exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute,      exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl  = , XF86AudioPlay,         exec, playerctl play-pause
bindl  = , XF86AudioNext,         exec, playerctl next
bindl  = , XF86AudioPrev,         exec, playerctl previous
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Rebinds made in the keybind menu live in conf.d/30-binds.conf, not here.
#
# The menu enters this submap while it waits for a new combo: with nothing
# bound in it, every key reaches the menu instead of firing its usual action.
# Escape always leaves it - from Hyprland's side, so it works even if the
# shell has died.
submap = rice-capture
bind = , escape, submap, reset
submap = reset
