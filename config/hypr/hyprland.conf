# ─── New Rice · Hyprland ─────────────────────────────────────────────────────
#
# Monitors and look live in THIS file on purpose: rice-settings' engines
# (rice-monitor-ctl.py, rice-look-ctl.py) read their baseline from
# hyprland.conf and write overrides into conf.d/. Everything else is in conf/.
#
# Check before reloading:
#   Hyprland --verify-config --config ~/.config/hypr/hyprland.conf

# Palette, generated from the wallpaper by matugen (see ~/.config/matugen).
source = ~/.config/hypr/colors.conf
source = ~/.config/hypr/conf/env.conf

# ---------------------------------------------------------------- monitors --
# Every output at its preferred mode, placed automatically. To pin one,
# add a line per monitor (`hyprctl monitors all` lists the names) - or use
# `rice-settings displays` (Super+Shift+D), which writes conf.d/ instead:
#   monitor = DP-1, 2560x1440@165, 0x0, 1
#   monitor = HDMI-A-1, 3840x2160@60, 2560x0, 1.5
#   monitor = DP-2, 2560x1440@180, 0x0, 1, vrr, 2    # VRR in fullscreen only
monitor = , preferred, auto, 1

# -------------------------------------------------------------------- look --
general {
    gaps_in = 2
    gaps_out = 8
    border_size = 2
    col.active_border = $primary $tertiary 45deg
    col.inactive_border = $divider
    layout = dwindle
    allow_tearing = true          # games; paired with `immediate` in rules.conf
    resize_on_border = true
}

decoration {
    rounding = 4
    active_opacity = 1.0
    inactive_opacity = 0.9

    shadow {
        enabled = true
        range = 5
        render_power = 2
        color = rgba(00000099)
    }

    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        xray = true
        noise = 0.02
        contrast = 1.0
        brightness = 0.9
    }
}

# flafy's easing curves
animations {
    enabled = true
    bezier = expoOut,  0.19, 1.0, 0.22, 1.0
    bezier = easeInOut, 0.5, 0, 0.5, 1

    animation = windows,     1, 4, expoOut
    animation = windowsIn,   1, 4, expoOut, popin 80%
    animation = windowsOut,  1, 4, expoOut, popin 80%
    animation = layers,      1, 3, expoOut, popin 90%
    animation = border,      1, 6, easeInOut
    animation = fade,        1, 4, expoOut
    animation = workspaces,  1, 4, expoOut, slide
}

dwindle {
    force_split = 2
    preserve_split = true
    default_split_ratio = 1.0     # even splits: cava | music, editor | terminal
}

# Window groups (tabbed tiles). Tabs are FILLED so
# their contrast does not depend on the wallpaper behind them (bare titles
# measured 1.54:1 against a pale sky). rice-theme-reload pushes new colours live.
group {
    col.border_active = $primary $tertiary 45deg
    col.border_inactive = $divider
    groupbar {
        font_size = 11
        height = 20
        gradients = yes
        indicator_height = 0
        col.active = $primary
        col.inactive = $raised
        text_color = $onprimary
        text_color_inactive = $text
    }
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    enable_swallow = true
    swallow_regex = ^(kitty|konsole|foot)$
    animate_manual_resizes = false
    focus_on_activate = true
    # If the lock screen (Quickshell's WlSessionLock) ever dies while locked,
    # the session stays locked but another locker may take over - from a TTY:
    #   hyprctl --instance 0 dispatch exec hyprlock
    allow_session_lock_restore = true
}

# Frosted shell surfaces. ignore_alpha makes the blur pass skip transparent
# pixels, so the gaps between waybar's islands stay clear instead of reading
# as one dimmed band (blur brightness 0.9 dims whatever it covers).
layerrule {
    name = waybar-glass
    match:namespace = ^(waybar)$
    blur = yes
    ignore_alpha = 0.3
}

layerrule {
    name = rofi-glass
    match:namespace = ^(rofi)$
    blur = yes
    ignore_alpha = 0.3
}

# The Quickshell cards (OSD, notifications, control centre, settings hub,
# keybind menu).
# Not rice-wallpaper: its backdrop is opaque, so blur would only cost frames.
layerrule {
    name = quickshell-glass
    match:namespace = ^(rice-osd|rice-notifications|rice-notifcenter|rice-controlcenter|rice-settings|rice-binds)$
    blur = yes
    ignore_alpha = 0.3
}

# ----------------------------------------------------------------- the rest --
source = ~/.config/hypr/conf/input.conf
source = ~/.config/hypr/conf/workspaces.conf
source = ~/.config/hypr/conf/rules.conf
source = ~/.config/hypr/conf/binds.conf
source = ~/.config/hypr/conf/autostart.conf

# Overrides written by rice-settings. Last, so they win; generated, so not in
# git. Delete one and `hyprctl reload` to fall back to the values above.
source = ~/.config/hypr/conf.d/*.conf
